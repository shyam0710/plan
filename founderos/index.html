<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FounderOS — AI Pipeline Core</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel (JSX transpilation in-browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn  { animation: fadeIn  0.25s ease both; }
    .animate-slideUp { animation: slideUp 0.3s ease both; }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #090b11; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }

    html, body { margin: 0; padding: 0; background: #090b11; }

    /* Range input thumb */
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #6366f1;
      cursor: pointer;
    }
    input[type=range]::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #6366f1;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_TASKS = [
      {
        id: '1',
        title: 'Launch beta page for FounderOS',
        description: 'Finalize the layout styling, add custom interaction triggers, and link up with analytics dashboards.',
        priority: 'high',
        status: 'today',
        is_revenue_generating: true,
        completed: false,
        scheduledTime: '10:00 AM',
        tags: ['SaaS', 'Launch', 'Frontend']
      },
      {
        id: '2',
        title: 'Send proposal to Acme Corp',
        description: 'Draft the tiered package proposal for the SaaS licensing. High custom priority onboarding setup.',
        priority: 'high',
        status: 'today',
        is_revenue_generating: true,
        completed: false,
        scheduledTime: '11:30 AM',
        tags: ['Proposals', 'Outreach']
      },
      {
        id: '3',
        title: 'Follow up on first level meeting with Beta Brand',
        description: 'Book follow-up meeting and send deck outlining execution indicators.',
        priority: 'medium',
        status: 'this_week',
        is_revenue_generating: false,
        completed: false,
        tags: ['Meetings', 'Nurture']
      },
      {
        id: '4',
        title: 'Refactor state manager logic',
        description: 'Ensure context-sensitive changes and reduce cumulative layout shifts across tabs.',
        priority: 'low',
        status: 'backlog',
        is_revenue_generating: false,
        completed: false,
        tags: ['Tech Debt', 'Optimization']
      },
      {
        id: '5',
        title: 'Gym workout session',
        description: 'Active core routines and functional mobility work.',
        priority: 'medium',
        status: 'today',
        is_revenue_generating: false,
        completed: true,
        scheduledTime: '6:00 PM',
        tags: ['Health']
      }
    ];

    const INITIAL_HABITS = [
      { id: 'h1', name: 'Wake up at 5:30 AM', completed: true,  streak: 12 },
      { id: 'h2', name: '3+ Hours Deep Work',  completed: false, streak: 4  },
      { id: 'h3', name: 'Workout or Cardio',   completed: true,  streak: 5  },
      { id: 'h4', name: 'Content post published', completed: false, streak: 1 },
      { id: 'h5', name: 'Evening AI Reflection',  completed: false, streak: 14 }
    ];

    const INITIAL_KPIS = [
      { date: '05-12', clientsSpoken: 4,  meetings: 2, proposals: 1, proposalVal: 5000  },
      { date: '05-13', clientsSpoken: 6,  meetings: 3, proposals: 2, proposalVal: 12000 },
      { date: '05-14', clientsSpoken: 3,  meetings: 1, proposals: 1, proposalVal: 4500  },
      { date: '05-15', clientsSpoken: 9,  meetings: 4, proposals: 3, proposalVal: 22000 },
      { date: '05-16', clientsSpoken: 5,  meetings: 2, proposals: 2, proposalVal: 9000  },
      { date: '05-17', clientsSpoken: 8,  meetings: 5, proposals: 3, proposalVal: 18500 },
      { date: '05-18', clientsSpoken: 11, meetings: 6, proposals: 4, proposalVal: 24000 }
    ];

    const INSIGHTS = [
      { type: 'positive',     text: 'You perform best between 8–11 AM. 74% of your first-level meetings are scheduled and won in this window.' },
      { type: 'warning',      text: 'Proposal conversion rate drops by 32% on days when consecutive screen time goes beyond 6 hours.' },
      { type: 'correlation',  text: 'Having at least 8 client conversations in a day correlates directly with sending 2.4x more proposals.' },
      { type: 'burnout',      text: 'High meeting volume days coincide with a 40% reduction in completed deep focus work sessions.' }
    ];

    const playBeep = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();

        if (type === 'start') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.1,  ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        } else if (type === 'complete') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
          osc.frequency.setValueAtTime(880,    ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        } else if (type === 'inject') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25,  ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1046.50, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(330, ctx.currentTime);
          gain.gain.setValueAtTime(0.1,  ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        }

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) {
        // audio blocked by browser policy — silently ignore
      }
    };

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [tasks,     setTasks]     = useState(INITIAL_TASKS);
      const [habits,    setHabits]    = useState(INITIAL_HABITS);
      const [kpiHistory, setKpiHistory] = useState(INITIAL_KPIS);

      const [toast, setToast] = useState(null);

      const [pipelineMetrics, setPipelineMetrics] = useState({
        clientsSpoken:      45,
        firstLevelMeetings: 23,
        proposalsSent:      15,
        proposalValue:      72500,
        totalRevenue:       39200,
        revenueTarget:      60000
      });

      const [intention,          setIntention]          = useState('Close proposal for Acme Corp and schedule two outreach demo rounds.');
      const [tempIntention,      setTempIntention]      = useState(intention);
      const [isEditingIntention, setIsEditingIntention] = useState(false);

      const [selectedTask,      setSelectedTask]      = useState(null);
      const [taskSearchQuery,   setTaskSearchQuery]   = useState('');
      const [taskTagFilter,     setTaskTagFilter]     = useState('');
      const [modalNewTagText,   setModalNewTagText]   = useState('');

      const [reflection, setReflection] = useState({
        wins: '', losses: '', energy: 8, mood: 8, isSubmitted: false, aiSummary: '', aiAnalysis: ''
      });

      const [reflectionsHistory, setReflectionsHistory] = useState([
        {
          date: 'May 17, 2026',
          wins: 'Closed proposals for startup client. Reached 11 client demo milestones.',
          losses: 'Proposals took longer to format than scheduled.',
          energy: 7, mood: 9,
          aiSummary: 'Strong pipeline momentum. Conversational ratios remain high.',
          aiAnalysis: 'Excellent productivity. Recommended strategy: schedule deep-focus blocks first thing to preserve afternoon focus.'
        }
      ]);

      const [timerMode,         setTimerMode]         = useState(25);
      const [secondsRemaining,  setSecondsRemaining]  = useState(25 * 60);
      const [timerRunning,      setTimerRunning]       = useState(false);
      const [timerIntervalId,   setTimerIntervalId]   = useState(null);
      const [distractions,      setDistractions]      = useState(0);
      const [completedSessions, setCompletedSessions] = useState(2);
      const [activeTimerTask,   setActiveTimerTask]   = useState('1');

      const [newTaskTitle,        setNewTaskTitle]        = useState('');
      const [newTaskDesc,         setNewTaskDesc]         = useState('');
      const [newTaskPriority,     setNewTaskPriority]     = useState('medium');
      const [newTaskIsRevenue,    setNewTaskIsRevenue]    = useState(false);
      const [newTaskScheduledTime,setNewTaskScheduledTime]= useState('');
      const [newTaskTagsRaw,      setNewTaskTagsRaw]      = useState('');

      const [newHabitName, setNewHabitName] = useState('');

      const [metricLogForm, setMetricLogForm] = useState({
        clients: '', meetings: '', proposals: '', value: '', revAdd: ''
      });

      const [chatMessages, setChatMessages] = useState([
        {
          id: 'welcome-1',
          sender: 'ai',
          text: "Welcome Shyam. I am your FounderOS Co-Pilot. Tell me about client meetings, custom proposals sent, or execution plans. I will dynamically guide you, map deal statistics, and automatically structure and inject tagged tasks directly into your execution board.",
          timestamp: 'Just now',
          tasksInjected: []
        }
      ]);
      const [currentMessage, setCurrentMessage] = useState('');
      const [isChatLoading,  setIsChatLoading]  = useState(false);
      const messagesEndRef = useRef(null);

      /* ── helpers ── */
      const showToast = (message, type = 'success') => setToast({ message, type });

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 3500);
        return () => clearTimeout(t);
      }, [toast]);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chatMessages, isChatLoading]);

      const fetchWithBackoff = async (url, options, retries = 3, delay = 1000) => {
        try {
          const res = await fetch(url, options);
          if (!res.ok) {
            if (res.status === 429 && retries > 0) {
              await new Promise(r => setTimeout(r, delay));
              return fetchWithBackoff(url, options, retries - 1, delay * 2);
            }
            throw new Error(`HTTP ${res.status}`);
          }
          return res;
        } catch (err) {
          if (retries > 0) {
            await new Promise(r => setTimeout(r, delay));
            return fetchWithBackoff(url, options, retries - 1, delay * 2);
          }
          throw err;
        }
      };

      const handleSendMessage = async (e) => {
        if (e) e.preventDefault();
        if (!currentMessage.trim() || isChatLoading) return;

        const userText = currentMessage;
        setCurrentMessage('');
        setIsChatLoading(true);

        const userMessage = {
          id: Date.now().toString(),
          sender: 'user',
          text: userText,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        setChatMessages(prev => [...prev, userMessage]);
        playBeep('click');

        try {
          const apiKey = "";
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

          const systemPrompt = `You are the ultimate strategic executive Co-Pilot for Shyam, a high-performance SaaS Founder.
Your responsibility is twofold:
1. Provide a high-caliber, brief, and highly direct response to their updates (clients spoken to, proposals sent, meetings, problems). Max 3 sentences.
2. Intelligently identify and parse ANY tasks, next steps, or meetings mentioned.

For each task you extract, identify:
- title: Actionable, concise, clear title.
- description: Detailed summary or next steps for the task.
- priority: "high", "medium", or "low".
- status: "today", "this_week", or "backlog" based on context.
- is_revenue_generating: true if directly tied to proposal preparation, sales calls, outbound meetings, proposals, or MRR.
- scheduledTime: Extracted scheduled hour (e.g. "3:00 PM").
- tags: Array of short string tags matching the context (e.g. ["proposal", "outreach", "tech"]).

You MUST respond strictly with the specified JSON schema structure. No extra text, headers, or markdown formatting outside of raw JSON representation.`;

          const payload = {
            contents: [{ role: "user", parts: [{ text: userText }] }],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  reply: { type: "STRING" },
                  extractedTasks: {
                    type: "ARRAY",
                    items: {
                      type: "OBJECT",
                      properties: {
                        title:                { type: "STRING" },
                        description:          { type: "STRING", nullable: true },
                        priority:             { type: "STRING", enum: ["high", "medium", "low"] },
                        status:               { type: "STRING", enum: ["today", "this_week", "backlog", "done"] },
                        is_revenue_generating:{ type: "BOOLEAN" },
                        scheduledTime:        { type: "STRING", nullable: true },
                        tags:                 { type: "ARRAY", items: { type: "STRING" } }
                      },
                      required: ["title", "priority", "status", "is_revenue_generating"]
                    }
                  }
                },
                required: ["reply", "extractedTasks"]
              }
            },
            systemInstruction: { parts: [{ text: systemPrompt }] }
          };

          const response = await fetchWithBackoff(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const result  = await response.json();
          const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text;

          if (rawText) {
            const parsed = JSON.parse(rawText);
            const newExtractedTasks = [];

            if (parsed.extractedTasks?.length > 0) {
              parsed.extractedTasks.forEach(item => {
                const taskObj = {
                  id: `ai-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`,
                  title:                 item.title,
                  description:           item.description || '',
                  priority:              item.priority || 'medium',
                  status:                item.status   || 'today',
                  is_revenue_generating: !!item.is_revenue_generating,
                  completed:             false,
                  scheduledTime:         item.scheduledTime || null,
                  tags:                  item.tags || []
                };
                newExtractedTasks.push(taskObj);
              });
              setTasks(prev => [...prev, ...newExtractedTasks]);
              playBeep('inject');
              showToast(`Successfully scheduled ${newExtractedTasks.length} task(s) from conversation!`, 'info');
            }

            setChatMessages(prev => [...prev, {
              id: `ai-${Date.now()}`,
              sender: 'ai',
              text: parsed.reply,
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              tasksInjected: newExtractedTasks
            }]);
          } else {
            throw new Error("Empty payload");
          }
        } catch (err) {
          console.error(err);
          setChatMessages(prev => [...prev, {
            id: `ai-err-${Date.now()}`,
            sender: 'ai',
            text: "Apologies, Shyam. My core context limits were interrupted. Tell me again what tasks I should inject into your Pipeline Board.",
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            tasksInjected: []
          }]);
        } finally {
          setIsChatLoading(false);
        }
      };

      const calculateFounderScore = () => {
        let score = 0;
        if (intention.trim().length > 0) score += 5;

        const completedHabitsCount = habits.filter(h => h.completed).length;
        score += (completedHabitsCount / habits.length) * 35;

        const todayTasks = tasks.filter(t => t.status === 'today');
        if (todayTasks.length > 0) {
          const completedTodayTasks = todayTasks.filter(t => t.completed);
          score += (completedTodayTasks.length / todayTasks.length) * 20;
          const revTasks = todayTasks.filter(t => t.is_revenue_generating);
          if (revTasks.length > 0)
            score += (revTasks.filter(t => t.completed).length / revTasks.length) * 10;
        } else {
          score += 30;
        }

        score += Math.min(completedSessions * 10, 20);
        if (reflection.isSubmitted) score += 10;
        return Math.min(100, Math.round(score));
      };

      const currentFounderScore = calculateFounderScore();

      useEffect(() => {
        if (!timerRunning) { if (timerIntervalId) clearInterval(timerIntervalId); return; }
        const interval = setInterval(() => {
          setSecondsRemaining(prev => {
            if (prev <= 1) {
              clearInterval(interval);
              setTimerRunning(false);
              setCompletedSessions(c => c + 1);
              playBeep('complete');
              showToast("Deep focus interval complete! 10 points added to Founder Index.", "success");
              setHabits(ph => ph.map(h => h.id === 'h2' ? { ...h, completed: true } : h));
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        setTimerIntervalId(interval);
        return () => clearInterval(interval);
      }, [timerRunning]);

      const handleStartTimer = () => {
        if (!timerRunning) { playBeep('start'); showToast("Entering deep focus state. Outbound distractions frozen.", "info"); }
        setTimerRunning(!timerRunning);
      };
      const handleResetTimer = (minutes = timerMode) => { setTimerRunning(false); setSecondsRemaining(minutes * 60); setTimerMode(minutes); };
      const formatTime = (s) => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

      const toggleTaskCompleted = (id) => {
        setTasks(prev => prev.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
        playBeep('click');
        showToast("Task completion toggled!", "info");
      };

      const addTask = (e) => {
        e.preventDefault();
        if (!newTaskTitle.trim()) { showToast("Please enter a valid task title.", "error"); return; }
        const parsedTags = (newTaskTagsRaw || '').split(',').map(t => t.trim()).filter(Boolean);
        setTasks(prev => [...prev, {
          id: Date.now().toString(),
          title: newTaskTitle.trim(), description: newTaskDesc.trim(),
          priority: newTaskPriority, status: 'today',
          is_revenue_generating: newTaskIsRevenue, completed: false,
          scheduledTime: newTaskScheduledTime.trim() || null, tags: parsedTags
        }]);
        setNewTaskTitle(''); setNewTaskDesc(''); setNewTaskScheduledTime('');
        setNewTaskIsRevenue(false); setNewTaskTagsRaw('');
        setTaskSearchQuery(''); setTaskTagFilter('');
        playBeep('complete');
        showToast("Task created successfully in Focus Today!", "success");
      };

      const moveTaskStatus = (id, newStatus) => {
        setTasks(prev => prev.map(t => t.id === id ? { ...t, status: newStatus } : t));
        showToast(`Task moved to ${newStatus.replace('_', ' ')}`, "info");
      };

      const deleteTask = (id) => {
        setTasks(prev => prev.filter(t => t.id !== id));
        if (selectedTask?.id === id) setSelectedTask(null);
        showToast("Task permanently deleted", "warning");
      };

      const updateTaskField = (id, field, value) => {
        setTasks(prev => prev.map(t => t.id === id ? { ...t, [field]: value } : t));
        setSelectedTask(prev => prev?.id === id ? { ...prev, [field]: value } : prev);
      };

      const handleAddTagToModal = (e) => {
        e.preventDefault();
        if (!modalNewTagText.trim() || !selectedTask) return;
        const cleanTag = modalNewTagText.trim();
        const currentTags = selectedTask.tags || [];
        if (!currentTags.includes(cleanTag)) {
          updateTaskField(selectedTask.id, 'tags', [...currentTags, cleanTag]);
          showToast(`Added tag #${cleanTag}`, "success");
        }
        setModalNewTagText('');
      };

      const handleRemoveTagFromModal = (tagToRemove) => {
        if (!selectedTask) return;
        updateTaskField(selectedTask.id, 'tags', (selectedTask.tags || []).filter(t => t !== tagToRemove));
        showToast(`Removed tag #${tagToRemove}`, "info");
      };

      const toggleHabitCompleted = (id) => {
        setHabits(prev => prev.map(h => h.id === id
          ? { ...h, completed: !h.completed, streak: !h.completed ? h.streak + 1 : Math.max(0, h.streak - 1) }
          : h));
        playBeep('click');
        showToast("Routine progress saved!", "success");
      };

      const addHabit = (e) => {
        e.preventDefault();
        if (!newHabitName.trim()) return;
        setHabits(prev => [...prev, { id: Date.now().toString(), name: newHabitName.trim(), completed: false, streak: 0 }]);
        setNewHabitName('');
        playBeep('click');
        showToast("New baseline habit established!", "success");
      };

      const submitReflection = (e) => {
        e.preventDefault();
        if (!reflection.wins.trim() && !reflection.losses.trim()) return;
        const sentimentWord = reflection.mood > 7 ? 'highly motivated' : reflection.mood > 4 ? 'balanced but focused' : 'fatigued/vulnerable';
        const dynamicSummary  = `Identified high momentum metrics. Accomplished key proposals with a ${sentimentWord} emotional state.`;
        const dynamicAnalysis = `Energy logged: ${reflection.energy}/10, Mood: ${reflection.mood}/10. Correlation: High client discussion rate maintains pipeline progression, but watch distraction thresholds during late focus sessions.`;
        const updated = { ...reflection, isSubmitted: true, aiSummary: dynamicSummary, aiAnalysis: dynamicAnalysis };
        setReflection(updated);
        setReflectionsHistory(prev => [{
          date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
          wins: reflection.wins, losses: reflection.losses,
          energy: reflection.energy, mood: reflection.mood,
          aiSummary: dynamicSummary, aiAnalysis: dynamicAnalysis
        }, ...prev]);
        setHabits(ph => ph.map(h => h.id === 'h5' ? { ...h, completed: true } : h));
        playBeep('complete');
        showToast("Evening reflection analysis compiled!", "success");
      };

      const addMetricLogs = (e) => {
        e.preventDefault();
        const c = parseInt(metricLogForm.clients)   || 0;
        const m = parseInt(metricLogForm.meetings)  || 0;
        const p = parseInt(metricLogForm.proposals) || 0;
        const v = parseFloat(metricLogForm.value)   || 0;
        const r = parseFloat(metricLogForm.revAdd)  || 0;
        setPipelineMetrics(prev => ({
          ...prev,
          clientsSpoken:      prev.clientsSpoken + c,
          firstLevelMeetings: prev.firstLevelMeetings + m,
          proposalsSent:      prev.proposalsSent + p,
          proposalValue:      prev.proposalValue + v,
          totalRevenue:       prev.totalRevenue + r
        }));
        const todayStr = new Date().toLocaleDateString('en-US', { month: '2-digit', day: '2-digit' }).replace('/', '-');
        setKpiHistory(prev => [...prev.slice(1), { date: todayStr, clientsSpoken: c||4, meetings: m||2, proposals: p||1, proposalVal: v||5000 }]);
        setMetricLogForm({ clients: '', meetings: '', proposals: '', value: '', revAdd: '' });
        playBeep('complete');
        showToast("Pipeline metrics refreshed successfully!", "success");
      };

      const activeTagsList = Array.from(new Set(tasks.flatMap(t => t.tags || []))).filter(Boolean);

      const filteredTasks = tasks.filter(t => {
        const matchesSearch = t.title.toLowerCase().includes(taskSearchQuery.toLowerCase()) ||
                              (t.description || '').toLowerCase().includes(taskSearchQuery.toLowerCase());
        const matchesTag = !taskTagFilter || (t.tags && t.tags.includes(taskTagFilter));
        return matchesSearch && matchesTag;
      });

                            <span>Energy: <strong className="text-indigo-400">{reflection.energy}/10</strong></span>
                            <span>Mood: <strong className="text-cyan-400">{reflection.mood}/10</strong></span>
                          </div>
                          <button onClick={() => { setReflection(prev => ({ ...prev, isSubmitted: false, wins: '', losses: '' })); playBeep('click'); }}
                            className="text-xs text-indigo-400 hover:underline">Reset / Enter New Session</button>
                        </div>
                      </div>
                    ) : (
                      <form onSubmit={submitReflection} className="space-y-6">
                        <div className="space-y-2">
                          <label className="text-xs font-bold text-slate-300">1. What were today's core strategic pipeline wins?</label>
                          <textarea value={reflection.wins} onChange={e => setReflection(prev => ({ ...prev, wins: e.target.value }))} rows="3"
                            placeholder="e.g. Sent out Acme proposals with a value index of 15k..."
                            className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500" required />
                        </div>
                        <div className="space-y-2">
                          <label className="text-xs font-bold text-slate-300">2. Where did outreach or execution stagger?</label>
                          <textarea value={reflection.losses} onChange={e => setReflection(prev => ({ ...prev, losses: e.target.value }))} rows="3"
                            placeholder="e.g. Long focus gaps preparing structural proposals..."
                            className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500" required />
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 py-2">
                          {[
                            { label: 'Physical Energy Score', key: 'energy', color: 'text-indigo-400', accent: 'accent-indigo-500' },
                            { label: 'Mood / Stress Level',   key: 'mood',   color: 'text-cyan-400',   accent: 'accent-cyan-400' }
                          ].map(({ label, key, color, accent }) => (
                            <div key={key} className="space-y-2">
                              <div className="flex justify-between text-xs font-bold text-slate-300">
                                <span>{label}</span><span className={color}>{reflection[key]} / 10</span>
                              </div>
                              <input type="range" min="1" max="10" value={reflection[key]}
                                onChange={e => setReflection(prev => ({ ...prev, [key]: parseInt(e.target.value) }))}
                                className={`w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer ${accent}`} />
                            </div>
                          ))}
                        </div>
                        <div className="flex items-center justify-between pt-4 border-t border-slate-900">
                          <span className="text-[10px] text-slate-500 max-w-sm">Insights run on custom algorithms matching stress to output proposals.</span>
                          <button type="submit" className="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-lg transition shadow shadow-indigo-600/10">Generate Core Feedback →</button>
                        </div>
                      </form>
                    )}
                  </div>

                  <div className="space-y-4">
                    <span className="text-[10px] text-slate-500 uppercase font-black tracking-widest block">Archives</span>
                    {reflectionsHistory.map((h, idx) => (
                      <div key={idx} className="bg-[#0d0f17] border border-slate-800/80 rounded-xl p-5 space-y-3">
                        <div className="flex justify-between items-center border-b border-slate-900 pb-2">
                          <span className="text-xs font-extrabold text-slate-300">{h.date}</span>
                          <div className="flex gap-3 text-[10px]"><span>Energy: <strong className="text-indigo-400">{h.energy}</strong></span><span>Mood: <strong className="text-cyan-400">{h.mood}</strong></span></div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs text-slate-400">
                          <div><strong className="text-slate-300 block mb-0.5">Wins:</strong><p>{h.wins}</p></div>
                          <div><strong className="text-slate-300 block mb-0.5">Losses:</strong><p>{h.losses}</p></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* ── KPIs ── */}
              {activeTab === 'kpis' && (
                <div className="space-y-6 animate-fadeIn">
                  <form onSubmit={addMetricLogs} className="bg-[#0d0f17] border border-slate-800 rounded-xl p-5 flex flex-wrap gap-4 items-end">
                    {[
                      { label: 'Clients Spoken With', key: 'clients',   ph: '5'    },
                      { label: '1st Level Meetings',  key: 'meetings',  ph: '2'    },
                      { label: 'Proposals Sent',      key: 'proposals', ph: '1'    },
                      { label: 'Proposal Value ($)',   key: 'value',     ph: '8500' },
                      { label: 'Won Revenue ($)',      key: 'revAdd',    ph: '2500' }
                    ].map(({ label, key, ph }) => (
                      <div key={key} className="flex-1 min-w-[120px] space-y-1.5">
                        <label className="text-[10px] text-slate-400 uppercase font-bold tracking-wider block">{label}</label>
                        <input type="number" value={metricLogForm[key]} onChange={e => setMetricLogForm(prev => ({ ...prev, [key]: e.target.value }))} placeholder={ph}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500" />
                      </div>
                    ))}
                    <button type="submit" className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-lg transition shadow">Log Pipeline Metrics</button>
                  </form>

                  <div className="bg-[#0d0f17] border border-slate-800 p-6 rounded-xl space-y-4">
                    <div className="flex justify-between items-center">
                      <div><h4 className="font-bold text-white text-base">Pipeline Goal Tracking</h4><p className="text-xs text-slate-500">Live tracker mapping proposals completed vs quarterly targets</p></div>
                      <span className="text-xs text-slate-400">Target: ${pipelineMetrics.revenueTarget.toLocaleString()}</span>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
                      <div className="space-y-2">
                        <span className="text-xs text-slate-500 block">Total Revenue Won</span>
                        <span className="text-3xl font-black text-emerald-400">${pipelineMetrics.totalRevenue.toLocaleString()}</span>
                        <p className="text-[11px] text-slate-400">You need ${(pipelineMetrics.revenueTarget - pipelineMetrics.totalRevenue).toLocaleString()} more to cross this cycle's targets.</p>
                      </div>
                      <div className="space-y-2">
                        <span className="text-xs text-slate-500 block">Identified Proposal Value Pipeline</span>
                        <span className="text-3xl font-black text-indigo-400">${pipelineMetrics.proposalValue.toLocaleString()}</span>
                        <p className="text-[11px] text-slate-400">Covering {pipelineMetrics.proposalsSent} active proposals.</p>
                      </div>
                      <div className="flex items-center justify-center">
                        <div className="relative flex items-center justify-center">
                          <svg className="w-24 h-24 transform -rotate-90">
                            <circle cx="48" cy="48" r="38" strokeWidth="6" stroke="#1e293b" fill="transparent" />
                            <circle cx="48" cy="48" r="38" strokeWidth="6" stroke="#10b981" fill="transparent"
                              strokeDasharray={238.76}
                              strokeDashoffset={238.76 - (238.76 * Math.min(100,(pipelineMetrics.totalRevenue/pipelineMetrics.revenueTarget)*100))/100}
                              strokeLinecap="round" className="transition-all duration-1000 ease-out" />
                          </svg>
                          <div className="absolute flex flex-col items-center">
                            <span className="text-lg font-black text-white">{Math.round((pipelineMetrics.totalRevenue/pipelineMetrics.revenueTarget)*100)}%</span>
                            <span className="text-[8px] text-slate-400">Achieved</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    {[
                      { title: 'First-Level Meetings Booked', sub: 'Manual logged daily outreach cycles', key: 'meetings', color: ['from-indigo-600','to-indigo-400'], hoverColor: ['from-indigo-400','to-cyan-400'], labelFn: v => `${v} meetings`, valColor: 'text-indigo-400' },
                      { title: 'Identified Proposal Value ($)', sub: 'Pipeline volumes generated',         key: 'proposalVal', color: ['from-emerald-600','to-teal-400'], hoverColor: ['from-emerald-400','to-cyan-400'], labelFn: v => `$${(v/1000).toFixed(1)}k`, valColor: 'text-emerald-400' }
                    ].map(chart => {
                      const maxVal = Math.max(...kpiHistory.map(k => k[chart.key]));
                      return (
                        <div key={chart.title} className="bg-[#0d0f17] border border-slate-800 rounded-xl p-6 space-y-4">
                          <div><h4 className="font-bold text-white text-base">{chart.title}</h4><p className="text-xs text-slate-500">{chart.sub}</p></div>
                          <div className="h-64 flex items-end justify-between relative pt-8 px-2 border-b border-l border-slate-800">
                            {kpiHistory.map((k, idx) => {
                              const hp = maxVal > 0 ? (k[chart.key] / maxVal) * 80 : 10;
                              return (
                                <div key={idx} className="flex-1 flex flex-col items-center group h-full justify-end relative">
                                  <span className={`text-[10px] ${chart.valColor} font-bold opacity-0 group-hover:opacity-100 absolute -top-5 transition duration-200`}>{chart.labelFn(k[chart.key])}</span>
                                  <div style={{ height: `${hp}%` }} className={`w-4 sm:w-8 bg-gradient-to-t ${chart.color[0]} ${chart.color[1]} rounded-t-sm group-hover:${chart.hoverColor[0]} group-hover:${chart.hoverColor[1]} transition-all duration-500`}></div>
                                  <span className="text-[9px] text-slate-500 mt-2 font-semibold">{k.date}</span>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* ── INSIGHTS ── */}
              {activeTab === 'insights' && (
                <div className="space-y-6 animate-fadeIn">
                  <div className="bg-[#0d0f17] border border-slate-800 rounded-xl p-6 md:p-8 relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-80 h-80 bg-indigo-500/5 blur-3xl rounded-full pointer-events-none"></div>
                    <div className="max-w-xl space-y-3 mb-8">
                      <div className="flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse"></span><span className="text-[10px] text-indigo-400 uppercase font-black tracking-widest">Performance Matrix</span></div>
                      <h3 className="text-2xl font-black text-white">Co-Pilot Executive Correlations</h3>
                      <p className="text-xs text-slate-400 leading-relaxed">By matching outbound deal velocity against sleep quality scores, daily habits, and deep focus timers, we isolate active momentum factors.</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {INSIGHTS.map((insight, idx) => (
                        <div key={idx} className="p-5 bg-slate-950 border border-slate-800 rounded-xl space-y-3 hover:border-slate-700/80 transition">
                          <div>
                            {insight.type === 'positive'    && <span className="px-2 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/30 text-[9px] text-emerald-400 font-bold uppercase tracking-widest">Energy Peak Correlation</span>}
                            {insight.type === 'warning'     && <span className="px-2 py-0.5 rounded bg-red-500/10 border border-red-500/30 text-[9px] text-red-400 font-bold uppercase tracking-widest">Stress Risk Factor</span>}
                            {insight.type === 'correlation' && <span className="px-2 py-0.5 rounded bg-indigo-500/10 border border-indigo-500/30 text-[9px] text-indigo-400 font-bold uppercase tracking-widest">Pipeline Accelerator</span>}
                            {insight.type === 'burnout'     && <span className="px-2 py-0.5 rounded bg-amber-500/10 border border-amber-500/30 text-[9px] text-amber-400 font-bold uppercase tracking-widest">Context Shift Alert</span>}
                          </div>
                          <p className="text-xs text-slate-300 leading-relaxed">"{insight.text}"</p>
                          <div className="pt-2 border-t border-slate-900 flex justify-between items-center text-[10px] text-slate-500">
                            <span>Confidence level: <strong>94% relational</strong></span>
                            <span className="text-indigo-400 cursor-pointer hover:underline">Apply Strategy Override →</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

            </div>

            {/* TOAST */}
            {toast && (
              <div className="fixed bottom-6 right-6 z-50 p-4 rounded-xl shadow-2xl bg-slate-900 border border-slate-800 text-xs text-slate-200 flex items-center gap-3 animate-slideUp max-w-sm">
                <div className={`w-2.5 h-2.5 rounded-full ${toast.type === 'success' ? 'bg-emerald-400' : toast.type === 'warning' ? 'bg-red-400' : 'bg-cyan-400'}`}></div>
                <span>{toast.message}</span>
                <button onClick={() => setToast(null)} className="ml-auto font-bold text-slate-500 hover:text-white transition">&times;</button>
              </div>
            )}
          </main>

          {/* TASK DETAIL MODAL */}
          {selectedTask && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-fadeIn">
              <div className="bg-[#0d0f17] border border-slate-800 rounded-xl w-full max-w-lg overflow-hidden flex flex-col shadow-2xl">
                <div className="p-5 border-b border-slate-800 flex items-center justify-between bg-slate-900/40">
                  <div className="flex items-center gap-2">
                    <span className="text-[10px] font-mono text-indigo-400 bg-indigo-400/10 px-2 py-0.5 rounded uppercase tracking-wider font-bold">Edit Task Details</span>
                    {selectedTask.is_revenue_generating && <span className="text-[10px] font-mono text-emerald-400 bg-emerald-400/10 px-2 py-0.5 rounded uppercase tracking-wider font-bold">$$ Rev Gen</span>}
                  </div>
                  <button onClick={() => setSelectedTask(null)} className="text-slate-400 hover:text-white transition text-lg font-bold">&times;</button>
                </div>

                <div className="p-5 space-y-4 max-h-[450px] overflow-y-auto">
                  <div className="space-y-1">
                    <label className="text-[10px] text-slate-500 uppercase tracking-widest font-black block">Task Title</label>
                    <input type="text" value={selectedTask.title} onChange={e => updateTaskField(selectedTask.id, 'title', e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 font-semibold" />
                  </div>
                  <div className="space-y-1">
                    <label className="text-[10px] text-slate-500 uppercase tracking-widest font-black block">Description</label>
                    <textarea rows="3" value={selectedTask.description || ''} onChange={e => updateTaskField(selectedTask.id, 'description', e.target.value)}
                      placeholder="Additional notes..."
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-300 focus:outline-none focus:border-indigo-500 leading-relaxed" />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div className="space-y-1">
                      <label className="text-[10px] text-slate-500 tracking-widest font-black uppercase block">Status</label>
                      <select value={selectedTask.status} onChange={e => updateTaskField(selectedTask.id, 'status', e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-2 text-xs text-slate-300 focus:outline-none cursor-pointer">
                        <option value="backlog">Task Backlog</option><option value="this_week">This Week</option><option value="today">Today (Focus)</option><option value="done">Fully Executed</option>
                      </select>
                    </div>
                    <div className="space-y-1">
                      <label className="text-[10px] text-slate-500 tracking-widest font-black uppercase block">Priority</label>
                      <select value={selectedTask.priority} onChange={e => updateTaskField(selectedTask.id, 'priority', e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-2 text-xs text-slate-300 focus:outline-none cursor-pointer">
                        <option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div className="space-y-1">
                      <label className="text-[10px] text-slate-500 tracking-widest font-black uppercase block">Execution Hour</label>
                      <input type="text" value={selectedTask.scheduledTime || ''} placeholder="e.g. 11:30 AM"
                        onChange={e => updateTaskField(selectedTask.id, 'scheduledTime', e.target.value || null)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-indigo-500" />
                    </div>
                    <div className="flex flex-col justify-end">
                      <button type="button" onClick={() => updateTaskField(selectedTask.id, 'is_revenue_generating', !selectedTask.is_revenue_generating)}
                        className={`py-2 px-3 rounded-lg border text-xs font-bold transition flex items-center justify-center gap-1.5 ${selectedTask.is_revenue_generating ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-700'}`}>
                        <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        Revenue Generating
                      </button>
                    </div>
                  </div>

                  <div className="space-y-2 border-t border-slate-800/80 pt-4">
                    <label className="text-[10px] text-slate-500 uppercase tracking-widest font-black block">Tag Manager</label>
                    <form onSubmit={handleAddTagToModal} className="flex gap-2">
                      <input type="text" placeholder="New tag..." value={modalNewTagText} onChange={e => setModalNewTagText(e.target.value)}
                        className="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500" />
                      <button type="submit" className="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-lg transition">Add Tag</button>
                    </form>
                    <div className="flex flex-wrap gap-1.5 pt-1">
                      {(selectedTask.tags || []).length === 0
                        ? <span className="text-xs text-slate-600 italic">No tags assigned.</span>
                        : (selectedTask.tags || []).map((tg, idx) => (
                          <span key={idx} className="px-2.5 py-1 bg-slate-950 border border-slate-800 rounded-full text-xs text-indigo-400 font-semibold flex items-center gap-1.5 animate-fadeIn">
                            #{tg}
                            <button type="button" onClick={() => handleRemoveTagFromModal(tg)} className="hover:text-red-400 text-slate-500 font-bold transition text-[10px]">&times;</button>
                          </span>
                        ))
                      }
                    </div>
                  </div>
                </div>

                <div className="p-4 bg-slate-900/40 border-t border-slate-800 flex items-center justify-between gap-2">
                  <button type="button" onClick={() => deleteTask(selectedTask.id)}
                    className="px-4 py-2 bg-red-600/10 hover:bg-red-600/25 border border-red-500/30 text-red-400 hover:text-red-300 text-xs font-bold rounded-lg transition flex items-center gap-1">
                    <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    Delete Task
                  </button>
                  <button type="button" onClick={() => setSelectedTask(null)} className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-black rounded-lg transition">Save & Close</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
